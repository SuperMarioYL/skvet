<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="架构：target repo/dir → fetch → discover bundles → rule engine (shell/hooks/network) → score → text/json report">
  <defs>
    <marker id="ah-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="360" fill="#1D1D1F"/>

  <text x="40" y="40" font-size="15" font-weight="700" fill="#F5F5F7">skvet · single Go binary · no daemon · no network beyond the git fetch</text>

  <g stroke="#3A3A44" stroke-width="1.5" fill="none">
    <line x1="186" y1="100" x2="232" y2="100" marker-end="url(#ah-d)"/>
    <line x1="378" y1="100" x2="424" y2="100" marker-end="url(#ah-d)"/>
    <line x1="500" y1="132" x2="500" y2="176" marker-end="url(#ah-d)"/>
    <line x1="354" y1="252" x2="300" y2="252" marker-end="url(#ah-d)"/>
    <line x1="180" y1="252" x2="134" y2="252" marker-end="url(#ah-d)"/>
    <line x1="74" y1="284" x2="74" y2="306" marker-end="url(#ah-d)"/>
  </g>

  <g>
    <rect x="40" y="72" width="146" height="56" rx="14" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5"/>
    <text x="113" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#4DA3FF">scan target</text>
    <text x="113" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">./dir · github.com/o/r</text>
  </g>

  <g>
    <rect x="232" y="72" width="146" height="56" rx="14" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5"/>
    <text x="305" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#4DA3FF">fetch</text>
    <text x="305" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">local · git clone --depth 1</text>
  </g>

  <g>
    <rect x="424" y="72" width="152" height="56" rx="14" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5"/>
    <text x="500" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#4DA3FF">discover bundles</text>
    <text x="500" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">SKILL.md · hooks.json · plugin</text>
  </g>

  <g>
    <rect x="424" y="176" width="408" height="92" rx="16" fill="#8985FF" fill-opacity="0.12" stroke="#8985FF" stroke-width="1.5"/>
    <text x="628" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#8985FF">rule engine · pure deterministic detectors</text>
    <g font-size="12" font-weight="600">
      <rect x="446" y="214" width="120" height="42" rx="11" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.3"/>
      <text x="506" y="232" text-anchor="middle" fill="#8985FF">shell</text>
      <text x="506" y="248" text-anchor="middle" font-size="10" font-weight="500" fill="#A1A1A8">curl|sh · scripts</text>

      <rect x="578" y="214" width="120" height="42" rx="11" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.3"/>
      <text x="638" y="232" text-anchor="middle" fill="#8985FF">hooks</text>
      <text x="638" y="248" text-anchor="middle" font-size="10" font-weight="500" fill="#A1A1A8">hooks.json commands</text>

      <rect x="710" y="214" width="100" height="42" rx="11" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.3"/>
      <text x="760" y="232" text-anchor="middle" fill="#8985FF">network</text>
      <text x="760" y="248" text-anchor="middle" font-size="10" font-weight="500" fill="#A1A1A8">outbound calls</text>
    </g>
  </g>

  <g>
    <rect x="180" y="224" width="174" height="56" rx="14" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5"/>
    <text x="267" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#2DC79A">score · 0–100</text>
    <text x="267" y="268" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">stars-orthogonal · LOW/MED/HIGH</text>
  </g>

  <g>
    <rect x="14" y="224" width="120" height="56" rx="14" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5"/>
    <text x="74" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#2DC79A">report</text>
    <text x="74" y="268" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">render</text>
  </g>

  <g font-size="11" font-weight="600">
    <rect x="14" y="306" width="56" height="30" rx="10" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.3"/>
    <text x="42" y="325" text-anchor="middle" fill="#2DC79A">text</text>
    <rect x="78" y="306" width="56" height="30" rx="10" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.3"/>
    <text x="106" y="325" text-anchor="middle" fill="#2DC79A">--json</text>
    <text x="148" y="325" font-size="11" font-weight="500" fill="#A1A1A8">exit 2 on HIGH</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="skvet — pre-install risk scan for agent skills">
  <defs>
    <linearGradient id="hd-name" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DA3FF"/>
      <stop offset="0.55" stop-color="#8985FF"/>
      <stop offset="1" stop-color="#FF6B52"/>
    </linearGradient>
    <linearGradient id="hd-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#8985FF"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="880" height="300" fill="#1D1D1F"/>

  <!-- shield mark with a scan sweep -->
  <g transform="translate(96 150)">
    <path d="M0,-66 L52,-44 L52,8 C52,46 28,68 0,80 C-28,68 -52,46 -52,8 L-52,-44 Z"
          fill="url(#hd-shield)" fill-opacity="0.18" stroke="url(#hd-shield)" stroke-width="2.5"/>
    <line x1="-46" y1="-6" x2="46" y2="-6" stroke="#FF6B52" stroke-width="3" stroke-linecap="round"/>
    <circle cx="46" cy="-6" r="4.5" fill="#FF6B52"/>
    <path d="M-22,16 L-6,32 L26,-6" fill="none" stroke="#2DC79A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="200" y="132" font-size="84" font-weight="800" letter-spacing="-2" fill="url(#hd-name)">skvet</text>

  <text x="202" y="178" font-size="25" font-weight="600" fill="#F5F5F7">装前一步的体检</text>
  <text x="202" y="212" font-size="20" font-weight="500" fill="#A1A1A8">pre-install risk scan for agent skills</text>

  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="202" y="236" width="76" height="28" rx="14" fill="#2DC79A" fill-opacity="0.18" stroke="#2DC79A" stroke-width="1.3"/>
    <text x="240" y="255" fill="#2DC79A">LOW</text>
    <rect x="288" y="236" width="96" height="28" rx="14" fill="#E8A33D" fill-opacity="0.18" stroke="#E8A33D" stroke-width="1.3"/>
    <text x="336" y="255" fill="#E8A33D">MEDIUM</text>
    <rect x="394" y="236" width="80" height="28" rx="14" fill="#FF6B52" fill-opacity="0.18" stroke="#FF6B52" stroke-width="1.3"/>
    <text x="434" y="255" fill="#FF6B52">HIGH</text>
    <text x="492" y="255" font-size="13" font-weight="500" text-anchor="start" fill="#A1A1A8">stars ≠ safe</text>
  </g>
</svg>
